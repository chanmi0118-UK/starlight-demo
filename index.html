<script>
// ===== 고정 값 =====
const APP = location.origin + location.pathname;
const ZONES = {
  'STAND-A':{name:'1층 스탠딩 A구역',stand:true}, 'STAND-B':{name:'1층 스탠딩 B구역',stand:true},
  'STAND-C':{name:'1층 스탠딩 C구역',stand:true}, 'STAND-D':{name:'1층 스탠딩 D구역',stand:true},
  'SEAT-1F':{name:'1층 지정석',floor:'1층',stand:false}, 'SEAT-2F':{name:'2층 지정석',floor:'2층',stand:false}
};
const ZONE_IDS = Object.keys(ZONES);
const SHORT = {'STAND-A':'스탠딩 A','STAND-B':'스탠딩 B','STAND-C':'스탠딩 C','STAND-D':'스탠딩 D','SEAT-1F':'1층 좌석','SEAT-2F':'2층 좌석'};
const CONDS = ['심장 질환','당뇨','천식','뇌전증','알레르기','기타'];
// 가지고 있는 약: 자유 입력(medsText) + 둔 곳(medsWhere)
const medsText = b => b.medsText ? b.medsText+(b.medsWhere?' ('+b.medsWhere+')':'') : '';
const BANDS = ['0001','0002','0003'];
const SEED = { // 0001은 발표 때 직접 등록, 0002는 미리 등록된 예시, 0003은 다음 날 받은 새 팔찌(불러오기 코드 시연)
  '0001':{registered:false},
  '0002':{registered:true,name:'김민준',phone:'010-0000-0000',zoneId:'SEAT-2F',seatDetail:'B구역 5열 12번',conditions:['심장 질환'],consent:true,keepConsent:true,recallCode:'482915'} // 지난 회차에 보관 동의한 예시
};
const GUIDE = {
  '당뇨':['대처 안내: 저혈당 의심','의식이 또렷하고 삼킬 수 있으면 본인 당 15~20g을 스스로 먹도록 돕기, 15분 뒤 다시 확인','* 의식이 흐리거나 경련하면 입으로 아무것도 주지 말고 즉시 119'],
  '심장 질환':['대처 안내: 심장 질환','의식·호흡이 없으면 119 + 가슴압박 + AED (음성 지시대로)'],
  '천식':['대처 안내: 천식','앉히고 본인 흡입기를 본인이 쓰도록 돕기','* 말을 못 잇거나 나아지지 않으면 즉시 119'],
  '뇌전증':['대처 안내: 뇌전증','시작 시각 기록, 위험물 치우기, 머리 보호','* 억누르거나 입에 물건 넣지 않기, 5분 이상·반복이면 119'],
  '알레르기':['대처 안내: 알레르기','즉시 119, 본인 자가주사기를 본인이 쓰도록 돕기','* 약을 썼어도 신고 유지']
};
// 스태프 카드 뒷면 '증상별 대처' (시연화면/스태프카드.html과 같은 문구)
const CARD = [
  ['심정지','119·AED 요청 → 가슴압박 → AED. 의사 찾기·공연 중단은 다른 스태프 / 의사 기다리며 늦추지 않기'],
  ['탈수·열탈진','서늘한 곳에서 식히기, 또렷하고 잘 삼키면 물 조금씩 / 혼란·회복 안 되면 119'],
  ['열사병','즉시 119, 피부를 물로 적시고 바람으로 빨리 식히기 / 입으로 X'],
  ['쇼크','119, 출혈 압박, 눕혀 보온 / 물·음식 X, 외상·숨참이면 다리 안 올림'],
  ['경련','시작 시각 기록, 위험물 치우기, 머리 보호 / 억누르기·입에 물건 X, 5분↑·반복은 119'],
  ['저혈당','또렷+삼킬 수 있으면 본인 당 15~20g 스스로 먹게 → 15분 뒤 확인 / 흐림·경련: 입으로 X, 119'],
  ['천식','앉히고 본인 흡입기를 본인이 쓰게 / 말 못 함·안 나아지면 119'],
  ['알레르기 쇼크','즉시 119, 본인 자가주사기를 본인이 쓰게, 시각 기록 / 썼어도 신고 유지'],
  ['출혈','장갑, 계속 직접 압박(들춰 보지 않기) / 심하면 즉시 119'],
  ['골절·척추','그 자세 그대로 받치고 119 / 맞추기·걷게 하기 X'],
  ['압사 위험','책임자 보고, 공연 중단·유입 통제, 빠져나온 사람 호흡 확인 / 혼자 인파 속 진입 X']
];
const HOSP = '즉시 병원: 의식 저하 · 호흡 곤란 · 경련 · 반복 구토 · 머리 부상 후 의식 흐림';
const COND_ROW = {'심장 질환':'심정지','당뇨':'저혈당','천식':'천식','뇌전증':'경련','알레르기':'알레르기 쇼크'};
function cardRows(r,b){ // 이 신고에 맞는 줄을 위로
  const hit=new Set();
  if(r.consciousness==='없음') hit.add('심정지');
  if(r.trauma==='있음'){ hit.add('출혈'); hit.add('골절·척추'); }
  if(b&&b.registered) b.conditions.forEach(c=>COND_ROW[c]&&hit.add(COND_ROW[c]));
  return [...CARD.filter(x=>hit.has(x[0])).map(x=>[...x,true]), ...CARD.filter(x=>!hit.has(x[0])).map(x=>[...x,false])];
}
// ===== 공연장 좌석도 (신고 위치에 불 켜기) =====
// 스탠딩은 구역(앞·중간·뒤), 지정석은 'B구역 5열 12번' 형식이면 그 자리, 아니면 구역 전체에 불
const MAPB = {
  'STAND-A':{x:60,y:70,w:200,h:150,t:'스탠딩 A'}, 'STAND-B':{x:280,y:70,w:200,h:150,t:'스탠딩 B'},
  'STAND-C':{x:520,y:70,w:200,h:150,t:'스탠딩 C'}, 'STAND-D':{x:740,y:70,w:200,h:150,t:'스탠딩 D'},
  'SEAT-1F':{y:262,h:118,rows:8,t:'1층 지정석'}, 'SEAT-2F':{y:422,h:96,rows:6,t:'2층 지정석'}
};
const BLK = {A:60,B:365,C:670}, BW=270, SEATS=16;
function locOf(r){
  const L=r.locationLabel||'', m=L.match(/([A-Ca-c])\s*구역\s*(\d+)\s*열\s*(\d+)\s*번/), p=L.match(/\((앞|중간|뒤)\)/);
  const z=MAPB[r.zoneId]; if(!z) return null;
  const ok=m&&+m[2]>=1&&+m[2]<=(z.rows||0)&&+m[3]>=1&&+m[3]<=SEATS;
  return {zone:r.zoneId, blk:ok?m[1].toUpperCase():null, row:ok?+m[2]:0, seat:ok?+m[3]:0, pos:p&&p[1]};
}
function venueMap(reps, mini){
  const hot=reps.map(r=>({...locOf(r),c:r.consciousness==='없음'?'#ef4444':'#f59e0b',lab:r.locationLabel})).filter(x=>x.zone), tags=[];
  const seatXY=(z,b,row,s)=>{ const B=MAPB[z]; return [BLK[b]+14+(s-1)*((BW-28)/(SEATS-1)), B.y+22+(row-1)*((B.h-32)/((B.rows-1)||1))]; };
  const dot=(x,y,c,big)=>`<circle class="ring" cx="${x}" cy="${y}" r="${big?9:6}" fill="none" stroke="${c}" stroke-width="3"/><circle class="blink" cx="${x}" cy="${y}" r="${big?9:6}" fill="${c}"/>`;
  let s=`<rect x="300" y="10" width="400" height="40" rx="8" fill="#334155"/><text x="500" y="36" text-anchor="middle" fill="#cbd5e1" font-size="17" font-weight="700">무대</text>
    <rect x="482" y="70" width="36" height="150" fill="none" stroke="#10b981" stroke-dasharray="5 5"/><text x="500" y="240" text-anchor="middle" fill="#6ee7b7" font-size="12">중앙 스태프 통로</text>`;
  ['STAND-A','STAND-B','STAND-C','STAND-D'].forEach(z=>{ const B=MAPB[z], h=hot.filter(x=>x.zone===z);
    s+=`<rect x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="10" fill="#1e293b" stroke="#475569"/>`;
    h.forEach(x=>{ const i={앞:0,중간:1,뒤:2}[x.pos]; const y=i==null?B.y:B.y+i*B.h/3, hh=i==null?B.h:B.h/3;
      s+=`<rect class="blink" x="${B.x}" y="${y}" width="${B.w}" height="${hh}" rx="10" fill="${x.c}" fill-opacity=".45" stroke="${x.c}" stroke-width="3"/>`; tags.push([B.x+B.w/2,y+hh/2,x]); });
    s+=`<text x="${B.x+B.w/2}" y="${B.y+B.h/2+6}" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="800">${B.t}</text>`;
    if(!mini) [1,2].forEach(k=>s+=`<line x1="${B.x+8}" x2="${B.x+B.w-8}" y1="${B.y+k*B.h/3}" y2="${B.y+k*B.h/3}" stroke="#334155" stroke-dasharray="3 4"/>`); });
  ['SEAT-1F','SEAT-2F'].forEach(z=>{ const B=MAPB[z], h=hot.filter(x=>x.zone===z);
    s+=`<text x="60" y="${B.y-8}" fill="#94a3b8" font-size="13" font-weight="700">${B.t}</text>`;
    Object.keys(BLK).forEach(b=>{ const lit=h.filter(x=>x.blk===b), whole=h.some(x=>!x.blk);
      s+=`<rect x="${BLK[b]}" y="${B.y}" width="${BW}" height="${B.h}" rx="8" fill="#1e293b" stroke="#475569"/>`;
      if(whole) s+=`<rect class="blink" x="${BLK[b]}" y="${B.y}" width="${BW}" height="${B.h}" rx="8" fill="${h.find(x=>!x.blk).c}" fill-opacity=".35" stroke="${h.find(x=>!x.blk).c}" stroke-width="3"/>`;
      if(whole&&b==='B') tags.push([500,B.y+B.h/2,{...h.find(x=>!x.blk),lab:h.find(x=>!x.blk).lab+' (좌석 번호 모름)'}]);
      if(mini){ if(lit.length) s+=`<rect x="${BLK[b]}" y="${B.y}" width="${BW}" height="${B.h}" rx="8" fill="${lit[0].c}" fill-opacity=".25" stroke="${lit[0].c}" stroke-width="3"/>`;
        s+=`<text x="${BLK[b]+BW/2}" y="${B.y+B.h/2+6}" text-anchor="middle" fill="#cbd5e1" font-size="17" font-weight="700">${b}구역</text>`; }
      else{ for(let r=1;r<=B.rows;r++) for(let k=1;k<=SEATS;k++){ const [x,y]=seatXY(z,b,r,k); s+=`<circle cx="${x}" cy="${y}" r="3.6" fill="#475569"/>`; }
        s+=`<text x="${BLK[b]+6}" y="${B.y+14}" fill="#94a3b8" font-size="11" font-weight="700">${b}구역</text>`;
        if(b==='A') for(let r=1;r<=B.rows;r++){ const [,y]=seatXY(z,b,r,1); s+=`<text x="${BLK.A-6}" y="${y+4}" text-anchor="end" fill="#64748b" font-size="10">${r}열</text>`; }
        [1,4,8,12,16].forEach(k=>{ const [x]=seatXY(z,b,1,k); s+=`<text x="${x}" y="${B.y+B.h+12}" text-anchor="middle" fill="#64748b" font-size="10">${k}</text>`; }); }
      lit.forEach(x=>{ const [px,py]=seatXY(z,b,x.row,x.seat); s+=dot(px,py,x.c,mini); tags.push([px,py,x]);
        if(!mini) s+=`<line x1="${BLK[b]}" x2="${BLK[b]+BW}" y1="${py}" y2="${py}" stroke="${x.c}" stroke-opacity=".5"/><line x1="${px}" x2="${px}" y1="${B.y}" y2="${B.y+B.h}" stroke="${x.c}" stroke-opacity=".5"/>`; }); }); });
  // 불이 켜진 곳 위에 위치 이름표 (모니터)
  if(!mini) tags.forEach(([x,y,o])=>{ const w=o.lab.length*14+24, tx=Math.min(Math.max(x-w/2,4),996-w), ty=Math.max(y-46,2);
    s+=`<g><rect x="${tx}" y="${ty}" width="${w}" height="28" rx="14" fill="${o.c}"/><text x="${tx+w/2}" y="${ty+19}" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">${esc(o.lab)}</text></g>`; });
  s+=`<text x="60" y="548" fill="#93c5fd" font-size="13" font-weight="700">◆ 응급처치실·AED (1층)</text><text x="940" y="548" text-anchor="end" fill="#93c5fd" font-size="13" font-weight="700">◆ AED (2층 통로)</text>`;
  if(mini) s=s.replace(/font-size="(\d+)"/g,(m,n)=>`font-size="${Math.round(n*1.8)}"`); // 폰에서도 읽히게
  return `<svg viewBox="0 0 1000 560" class="w-full h-auto block" role="img" aria-label="공연장 좌석도, 신고 위치 표시">${s}</svg>`;
}

const STATUS = {received:'접수',dispatched:'출동 중',verified:'도착·확인',closed:'종료',cancelled:'취소됨'};
const seedBand = id => Object.assign({registered:false,name:'',phone:'',zoneId:null,seatDetail:'',conditions:[],medsText:'',medsWhere:'',consent:false,keepConsent:false,recallCode:''}, SEED[id]||{});

// ===== 유틸 =====
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const clock = t => t ? new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
const mem = {};
function dget(k,d){ try{ const v=localStorage.getItem('sl2-'+k); return v==null?d:JSON.parse(v); }catch(e){ return mem[k]==null?d:mem[k]; } }
function dset(k,v){ mem[k]=v; try{ v==null?localStorage.removeItem('sl2-'+k):localStorage.setItem('sl2-'+k,JSON.stringify(v)); }catch(e){} }
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

// ===== 저장소: 아티팩트 공유 DB (없으면 이 기기 안에서만) =====
const S = {bands:{},reports:{},ready:false};
let DB=null, bc=null;
const LKEY='sl2-local';
const getBand = id => S.bands[id] || seedBand(id);
function localLoad(){ let st=null; try{ st=JSON.parse(localStorage.getItem(LKEY)); }catch(e){} return st||mem.local||{bands:{},reports:{}}; }
function localSave(st){ mem.local=st; try{ localStorage.setItem(LKEY,JSON.stringify(st)); }catch(e){} try{ bc&&bc.postMessage(1); }catch(e){} }
function localApply(){ const st=localLoad(); S.bands=st.bands; S.reports=st.reports; S.ready=true; onData(); }
async function init(){
  let db=null;
  try{ if(FIREBASE_CONFIG&&window.firebase){ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); } }catch(e){ toast('Firebase 설정 오류'); }
  if(db){
    DB=db; let gotB=false, gotR=false;
    const ok=()=>{ if(gotB&&gotR) S.ready=true; onData(); };
    const bad=()=>toast('연결 오류 — 새로고침해 주세요');
    DB.collection('bands').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.bands=o; gotB=true; ok(); },bad);
    DB.collection('reports').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=Object.assign({},d.data(),{id:d.id})); S.reports=o; gotR=true; ok(); },bad);
  }else{
    try{ bc=new BroadcastChannel('sl2'); bc.onmessage=localApply; }catch(e){}
    addEventListener('storage',e=>{ if(e.key===LKEY) localApply(); });
    localApply();
  }
}
async function write(fn){ for(let i=0;i<3;i++){ try{ return await fn(); }catch(e){ if(i===2){ toast('전송 실패 — 다시 눌러 주세요'); throw e; } await new Promise(r=>setTimeout(r,400)); } } }
async function saveBand(id,b){
  const full=Object.assign(getBand(id),b);
  if(!DB){ const st=localLoad(); st.bands[id]=full; localSave(st); return localApply(); }
  S.bands[id]=full; onData(); await write(()=>DB.collection('bands').doc(id).set(full));
}
async function addReport(r){
  if(!DB){ const st=localLoad(); st.reports[r.id]=r; localSave(st); return localApply(); }
  S.reports[r.id]=r; onData(); const c=Object.assign({},r); delete c.id;
  await write(()=>DB.collection('reports').doc(r.id).set(c));
}
async function patch(id,p){
  if(!DB){ const st=localLoad(); if(st.reports[id]) Object.assign(st.reports[id],p); localSave(st); return localApply(); }
  if(S.reports[id]) Object.assign(S.reports[id],p); onData(); await write(()=>DB.collection('reports').doc(id).update(p));
}
async function resetAll(){
  if(!DB){ localSave({bands:{},reports:{}}); return localApply(); }
  for(const id of Object.keys(S.reports)) await write(()=>DB.collection('reports').doc(id).delete());
  for(const id of Object.keys(S.bands)) if(!BANDS.includes(id)) await write(()=>DB.collection('bands').doc(id).delete());
  for(const id of BANDS) await write(()=>DB.collection('bands').doc(id).set(seedBand(id)));
}

// ===== 스태프 폰 카메라로 환자 팔찌 QR 읽기 =====
let scanStream=null, scanTimer=null;
const scanCanvas=document.createElement('canvas');
async function startScan(){
  const box=$('scanner'), msg=$('scan-msg'), video=$('scan-video');
  box.hidden=false; msg.textContent='카메라를 켜는 중…';
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    video.srcObject=scanStream; await video.play(); msg.textContent='팔찌 QR을 찾는 중…';
    const ctx=scanCanvas.getContext('2d',{willReadFrequently:true});
    const loop=()=>{
      if(!scanStream) return;
      if(video.readyState>=2 && window.jsQR){
        const w=scanCanvas.width=video.videoWidth, h=scanCanvas.height=video.videoHeight;
        ctx.drawImage(video,0,0,w,h);
        const code=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
        if(code){
          const m=/band-(\d{4})/.exec(code.data)||/^(\d{4})$/.exec(code.data.trim());
          if(m&&BANDS.includes(m[1])){ stopScan(); try{ navigator.vibrate&&navigator.vibrate(150); }catch(e){} return staffVerify(m[1]); }
          msg.textContent='팔찌 QR이 아니에요. 환자 손목의 팔찌 QR을 비추세요.';
        }
      }
      scanTimer=setTimeout(loop,200);
    };
    loop();
  }catch(e){
    msg.textContent='카메라를 쓸 수 없어요. 닫고 아래 칸에 팔찌 번호를 입력하세요.';
  }
}
function stopScan(){
  clearTimeout(scanTimer); scanTimer=null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  const v=$('scan-video'); if(v) v.srcObject=null;
  $('scanner').hidden=true;
}

function newCode(){ let c; do{ c=String(Math.floor(100000+Math.random()*900000)); }while(Object.values(S.bands).some(b=>b.recallCode===c)); return c; }

}

function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-since]').forEach(el=>{ const stop=+el.dataset.stop||0; el.textContent=fmt((stop||now)-(+el.dataset.since)); });
  document.querySelectorAll('[data-until]').forEach(el=>{ const left=+el.dataset.until-now; if(left<=0) el.remove(); else (el.querySelector('[data-cd]')||el).textContent=`실수로 눌렀어요 (${Math.ceil(left/1000)}초 안에 취소)`; });
}

// ===== 스태프 알림·자동 동작 =====
let audio=null, known=null, pendingBand=null;
document.addEventListener('click',()=>{ try{ if(!audio){ const C=window.AudioContext||window.webkitAudioContext; if(C) audio=new C(); } audio&&audio.resume&&audio.resume(); }catch(e){} },{capture:true});
function ring(){
  try{ if(audio){ const t=audio.currentTime; [0,.25].forEach(d=>{ const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.001,t+d); g.gain.exponentialRampToValueAtTime(.4,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.18); o.start(t+d); o.stop(t+d+.2); }); } }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([300,120,300]); }catch(e){}
  document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
}
const isStaff = () => dget('role',null)==='staff';
function onData(){
  if(!S.ready) return;
  if(pendingBand){ const id=pendingBand; pendingBand=null; return staffVerify(id); }
  if(isStaff()){
    const ids=Object.keys(S.reports);
    if(known===null) known=new Set(ids);
    else{ const fresh=ids.filter(id=>!known.has(id)); fresh.forEach(id=>known.add(id)); if(fresh.some(id=>isOpen(S.reports[id]))) ring(); }
    // 의식 없음 신고: 그 신고의 출동 화면에 있으면 119 문자 창을 한 번 자동으로 연다
    if(autoSms()) ring();
    if(V.s==='S1'){ const opened=dget('urgentSeen',[]); const u=openReports().find(r=>r.consciousness==='없음'&&!opened.includes(r.id)); if(u){ opened.push(u.id); dset('urgentSeen',opened); ring(); } }
  }
  if(LIVE.has(V.s)) render();
}
async function staffVerify(bandId){
  let r=S.reports[dget('active',null)];
  if(!r||!isOpen(r)) r=openReports()[0];
  // 확인할 신고가 없으면 확인이 아니라 관객으로 찍은 것: 관객 화면을 연다
  if(!r) return getBand(bandId).registered ? openReportFor({band:bandId}) : go('A1',{band:bandId});
  const wasPlace=!r.bandId, result=r.bandId===bandId?'일치':'변경';
  const p={status:'verified',verifiedAt:r.verifiedAt||Date.now(),verifyResult:result,acceptedAt:r.acceptedAt||Date.now()};
  if(result==='변경'){ p.originalBandId=r.bandId||null; p.bandId=bandId; }
  dset('active',r.id);
  await patch(r.id,p);
  go('S3',{id:r.id,result,wasPlace});
}

  backA1(){ go('A1',{band:V.p.band}); },
  recallOpen(){ V.p.recall=true; render(); const i=$('recall'); i&&i.focus(); },
  recall(){ const code=($('recall').value||'').replace(/\D/g,'');
    const src=Object.entries(Object.assign(Object.fromEntries(BANDS.map(id=>[id,getBand(id)])),S.bands)).find(([id,b])=>id!==V.p.band&&b.keepConsent&&b.recallCode===code);
    if(code.length!==6||!src) return toast('코드를 찾지 못했어요');
    const b=src[1];
    go('A2',{band:V.p.band,f:{name:b.name||'',phone:b.phone||'',zoneId:null,seatDetail:'',conditions:(b.conditions||[]).slice(),medsText:b.medsText||'',medsWhere:b.medsWhere||'',consent:!!b.consent}});
    toast('정보를 불러왔어요. 오늘 좌석만 골라 주세요'); },
  nextShow(){ // 다음 날 새 팔찌(0003)를 찍은 것처럼 코드 입력 화면으로
    if(getBand('0003').registered) return toast('팔찌 0003이 이미 등록돼 있어요. 초기화 후 다시 해 보세요');
    go('A1',{band:'0003',recall:true}); toast('다음 날 새 팔찌 #0003이에요. 받은 코드를 넣어 보세요'); },
  async keep(){ await saveBand(V.p.band,{keepConsent:true,recallCode:newCode()}); render(); },
  call119(){ toast('시연용: 실제로 전화가 걸리지 않습니다'); },
  toReport(){ openReportFor({band:V.p.band}); },
  fzone(z){ V.p.f.zoneId=z; render(); },
  fcond(c){ const a=V.p.f.conditions, i=a.indexOf(c); i<0?a.push(c):a.splice(i,1); render(); },
  async save(){ const F=V.p.f, mt=F.medsText.trim();
    if(F.minor&&!F.guardian) return toast('만 14세 미만은 보호자 동의가 있어야 등록돼요');
    if((F.conditions.length||mt)&&!F.consent) return toast('지병·가지고 있는 약을 저장하려면 동의가 필요해요');
    await saveBand(V.p.band,{registered:true,name:F.name.trim(),phone:F.phone.trim(),zoneId:F.zoneId||null,seatDetail:F.zoneId&&!ZONES[F.zoneId].stand?F.seatDetail.trim():'',conditions:F.consent?F.conditions:[],medsText:F.consent?mt:'',medsWhere:F.consent&&mt?F.medsWhere.trim():'',consent:F.consent,minor:!!F.minor,guardian:!!(F.minor&&F.guardian),registeredAt:Date.now(),
      ...(F.keep?{keepConsent:true,recallCode:getBand(V.p.band).recallCode||newCode()}:{})});
    go('A2',{band:V.p.band,done:true}); },
  pzone(z){ V.p.zone=z; V.p.pos=null; render(); },
  ppos(x){ V.p.pos=V.p.pos===x?null:x; render(); },
  async send(){ const p=V.p; if(p.sending) return;
    const b=p.band?getBand(p.band):null;
    const zoneId=p.place||(b&&b.registered&&b.zoneId)||p.zone; if(!zoneId) return;
    const base=p.place?ZONES[zoneId].name:(b&&b.registered&&b.zoneId?seatLabel(b):ZONES[zoneId].name);
    const r={id:'r'+Date.now()+Math.random().toString(36).slice(2,6),createdAt:Date.now(),source:p.place?'place':'band',bandId:p.place?null:p.band,
      originalBandId:null,placeId:p.place||null,zoneId,locationLabel:base+(p.pos?' ('+p.pos+')':''),consciousness:null,trauma:null,status:'received',
      acceptedAt:null,verifiedAt:null,closedAt:null,cancelledAt:null,verifyResult:null,sms119At:null,outcome:null};
    p.sending=true; render();
    try{ await addReport(r); go('A4',{id:r.id}); }catch(e){ p.sending=false; render(); } },
  async cancel(){ const r=S.reports[V.p.id]; if(!r||r.status!=='received'||Date.now()-r.createdAt>10000) return; await patch(r.id,{status:'cancelled',cancelledAt:Date.now()}); },
  async pick(a){ const [f,v]=a.split('|'); const r=S.reports[V.p.id]; if(!r) return; const nv=r[f]===v?null:v;
    await patch(r.id,{[f]:nv}); if(f==='consciousness'&&nv==='없음') go('A5',{id:r.id}); },
  backA4(){ go('A4',{id:V.p.id}); },
  async dispatch(id){ const r=S.reports[id]; dset('active',id); if(r.status==='received') await patch(id,{status:'dispatched',acceptedAt:Date.now()}); go('S2',{id}); },
  card(){ V.p.card=!V.p.card; render(); },
  sms(){ V.p.sms=true; render(); },
  closeSms(){ V.p.sms=false; render(); },
  async sendSms(){ await patch(V.p.id,{sms119At:Date.now()}); toast('시연용: 실제로 보내지 않았습니다'); },
  async close(){ const r=S.reports[V.p.id]; await patch(r.id,{status:'closed',closedAt:Date.now(),outcome:r.sms119At?'119 인계':'응급처치실 인계'}); dset('active',null); go('S4',{id:r.id}); },
  scan(){ startScan(); },
  scanClose(){ stopScan(); },
  manualVerify(){ const v=($('bandno').value||'').replace(/\D/g,'').padStart(4,'0'); if(!BANDS.includes(v)) return toast('팔찌 번호를 찾지 못했어요'); staffVerify(v); },
  toMonitor(){ location.hash='monitor'; route(); },
  toHome(){ dset('role',null); location.hash='home'; route(); },
  toS1(){ go('S1'); },
  toS2(id){ go('S2',{id}); },
  async reset(){ if(!V.p.confirm){ V.p.confirm=true; const s=V.s; setTimeout(()=>{ if(V.s===s&&V.p.confirm){ V.p.confirm=false; render(); } },4000); return render(); }
    toast('초기화 중…'); await resetAll(); [V.s==='M1'?'':'role','active','smsOpened','urgentSeen'].forEach(k=>k&&dset(k,null)); known=null; V.p.confirm=false; render(); toast('처음 상태로 되돌렸어요'); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=ACT[el.dataset.act]; if(f) f(el.dataset.arg,el); });
document.addEventListener('input',e=>{ if(e.target.id==='recall'&&e.target.value.replace(/\D/g,'').length===6) return ACT.recall(); // 6자리를 다 넣으면 바로 불러오기
  const k=e.target.dataset&&e.target.dataset.f; if(!k||!V.p.f) return; V.p.f[k]=e.target.type==='checkbox'?e.target.checked:e.target.value; });

// ===== 진입 (QR 해시) =====
function openReportFor(p){
  const dup=openReports().find(r=>p.place?r.placeId===p.place:r.bandId===p.band);
  if(dup) return go('A4',{id:dup.id});
  go('A3',p);
}
function route(){
  const h=decodeURIComponent((location.hash||'').slice(1));
  if(h==='staff'){ dset('role','staff'); known=null; return go('S1'); }
  if(h==='monitor'){ dset('role','monitor'); return go('M1'); }
  if(h==='reset') return go('RESET');
  if(h==='home'){ dset('role',null); return go('HOME'); }
  if(h.startsWith('band-')&&BANDS.includes(h.slice(5))){
    const id=h.slice(5);
    if(isStaff()){ if(S.ready) return staffVerify(id); pendingBand=id; return go('S1'); }
    if(!S.ready){ V={s:'WAIT',p:{band:id}}; $('app').innerHTML=loading; return; }
    return getBand(id).registered ? openReportFor({band:id}) : go('A1',{band:id});
  }
  if(h.startsWith('qr-')&&ZONES[h.slice(3)]) return S.ready?openReportFor({place:h.slice(3)}):(V={s:'WAIT',p:{place:h.slice(3)}});
  // 로그인하느라 주소 뒤가 지워졌을 때: 이 기기의 역할로
  if(isStaff()) return go('S1');
  if(dget('role',null)==='monitor') return go('M1');
  go('HOME');
}
// 데이터가 준비되기 전에 팔찌·펜스 QR로 들어온 경우
const _onData=onData;
onData=function(){ if(V.s==='WAIT'&&S.ready){ const p=V.p; if(p.place) return openReportFor({place:p.place}); return getBand(p.band).registered?openReportFor({band:p.band}):go('A1',{band:p.band}); } return _onData(); };
addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; if(e.target.id==='bandno') ACT.manualVerify(); if(e.target.id==='recall') ACT.recall(); });
route();
init();
</script>
</body></html>
