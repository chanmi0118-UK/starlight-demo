<style>
/* Layout: 폰 한 열(최대 480px), 모니터만 넓게. 관객=밝은 시안, 스태프·모니터=어두운 공연장용으로 고정 */
:root{
  --red:#C8102E; --on-red:#FFFFFF; --ink:#1A1D23; --sub:#5B6270; --line:#E2E4EA;
  --paper:#FFFFFF; --soft:#F4F5F7; --warnbg:#FCE9EC; --amber:#B45309; --amberbg:#FEF3C7;
  --green:#15803D; --greenbg:#DCFCE7;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
body.dark{
  --red:#FF4D5E; --ink:#F2F4F7; --sub:#A0A8B6; --line:#2B313C; --paper:#0E1116; --soft:#181C24;
  --warnbg:#3B1219; --amber:#FBBF24; --amberbg:#3A2A0A; --green:#4ADE80; --greenbg:#0F2E1C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.flash{animation:flash .5s 3}
@keyframes flash{50%{box-shadow:inset 0 0 0 10px var(--red)}}
@media (prefers-reduced-motion:reduce){body.flash{animation:none}}
.wrap{max-width:480px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1200px}
.brand{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand i{font-style:normal;color:var(--red)}
h1{font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--sub);font-size:15px}
.small{font-size:13px;color:var(--sub)}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
.card{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.line{background:transparent;border:1px solid var(--line)}
.warn{background:var(--warnbg);color:var(--red);font-weight:800;border-radius:12px;padding:10px 14px}
.big{font-size:22px;font-weight:900;line-height:1.35}
.btn{appearance:none;border:0;border-radius:14px;min-height:54px;padding:12px 16px;font:inherit;font-size:17px;font-weight:800;background:var(--soft);color:var(--ink);cursor:pointer;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btn small{font-size:13px;font-weight:500;opacity:.85}
.btn.red{background:var(--red);color:var(--on-red)}
.btn.out{background:transparent;border:2px solid var(--line)}
.btn.green{background:var(--green);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sos{width:180px;height:180px;border-radius:50%;margin:4px auto;font-size:32px;box-shadow:0 0 0 10px var(--warnbg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{appearance:none;font:inherit;font-size:15px;font-weight:700;min-height:46px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warnbg);color:var(--red)}
.badge{display:inline-block;font-weight:900;padding:4px 10px;border-radius:8px;font-size:14px}
.b-urgent{background:var(--red);color:var(--on-red)}
.b-check{background:var(--amberbg);color:var(--amber)}
.b-gray{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.b-ok{background:var(--greenbg);color:var(--green)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
input[type=text]{font:inherit;font-size:17px;min-height:48px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.consent input{width:24px;height:24px;flex:none;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:700;min-width:0}
ul.g{margin:0;padding-left:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.modal .in{background:var(--paper);width:100%;border-top:3px solid var(--red);border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
pre.msg{white-space:pre-wrap;font:inherit;font-size:15px;background:var(--soft);border-radius:10px;padding:12px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;color:var(--sub);font-size:13px;font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.done td{opacity:.45}
tr.new td{background:var(--warnbg)}
.num{font-variant-numeric:tabular-nums}
.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qr{background:#fff;padding:8px;border-radius:10px}
.qr img,.qr canvas{display:block;width:180px;max-width:100%;height:auto}
.count{font-size:40px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
</style>

</head><body>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
// ===== 고정 값 =====
const APP = location.origin + location.pathname;
const ZONES = {
  'STAND-A':{name:'1층 스탠딩 A구역',stand:true}, 'STAND-B':{name:'1층 스탠딩 B구역',stand:true},
  'STAND-C':{name:'1층 스탠딩 C구역',stand:true}, 'STAND-D':{name:'1층 스탠딩 D구역',stand:true},
  'SEAT-1F':{name:'1층 지정석',floor:'1층',stand:false}, 'SEAT-2F':{name:'2층 지정석',floor:'2층',stand:false}
};
const ZONE_IDS = Object.keys(ZONES);
const SHORT = {'STAND-A':'스탠딩 A','STAND-B':'스탠딩 B','STAND-C':'스탠딩 C','STAND-D':'스탠딩 D','SEAT-1F':'1층 좌석','SEAT-2F':'2층 좌석'};
const CONDS = ['심장 질환','당뇨','천식','뇌전증','알레르기','기타'];
const BANDS = ['0001','0002'];
const SEED = { // 예시 2개: 0001은 발표 때 직접 등록, 0002는 미리 등록된 예시
  '0001':{registered:false},
  '0002':{registered:true,name:'김민준',phone:'010-0000-0000',zoneId:'SEAT-2F',seatDetail:'B구역 5열 12번',conditions:['심장 질환'],consent:true}
};
const GUIDE = {
  '당뇨':['대처 안내: 저혈당 의심','의식이 또렷하면 혈당 확인 후 당질 15g, 15분 뒤 다시 확인','* 의식이 나빠지거나 숨쉬기 힘들면 즉시 119'],
  '심장 질환':['대처 안내: 심장 질환','의식·호흡이 없으면 119 + 가슴압박 + AED'],
  '천식':['대처 안내: 천식','본인 흡입기 사용 보조'],
  '뇌전증':['대처 안내: 뇌전증','경련하면 주변 정리, 머리 받치기, 시간 기록'],
  '알레르기':['대처 안내: 알레르기','본인 자가주사기 사용 보조, 119']
};
// 스태프 카드 뒷면 '증상별 대처' (시연화면/스태프카드.html과 같은 문구)
const CARD = [
  ['심정지','119·AED 요청 → 가슴압박 → AED, 공연 중단, 관객 중 의사 찾기'],
  ['탈진·열사병','서늘한 곳, 119, 젖은 타월·바람, 의식 있으면 수분'],
  ['쇼크','다리 15~30cm 올리고 보온, 입으로 아무것도 X'],
  ['경련','주변 정리, 머리 받치기, 시간 기록'],
  ['저혈당','의식 또렷: 혈당 70 이하면 당질 15g → 15분 후 재측정 / 의식 흐림: 입으로 X, 119'],
  ['천식','본인 흡입기 사용 보조'],
  ['알레르기 쇼크','본인 자가주사기 사용 보조, 119'],
  ['출혈','5분 이상 직접 압박'],
  ['골절','119, 움직이지 않게 고정'],
  ['압사 위험','공연 중단, 밀도 낮추기']
];
const HOSP = '즉시 병원: 의식 저하 · 호흡 곤란 · 경련 · 반복 구토 · 머리 부상 후 의식 흐림';
const COND_ROW = {'심장 질환':'심정지','당뇨':'저혈당','천식':'천식','뇌전증':'경련','알레르기':'알레르기 쇼크'};
function cardRows(r,b){ // 이 신고에 맞는 줄을 위로
  const hit=new Set();
  if(r.consciousness==='없음') hit.add('심정지');
  if(r.trauma==='있음'){ hit.add('출혈'); hit.add('골절'); }
  if(b&&b.registered) b.conditions.forEach(c=>COND_ROW[c]&&hit.add(COND_ROW[c]));
  return [...CARD.filter(x=>hit.has(x[0])).map(x=>[...x,true]), ...CARD.filter(x=>!hit.has(x[0])).map(x=>[...x,false])];
}
const STATUS = {received:'접수',dispatched:'출동 중',verified:'도착·확인',closed:'종료',cancelled:'취소됨'};
const seedBand = id => Object.assign({registered:false,name:'',phone:'',zoneId:null,seatDetail:'',conditions:[],consent:false}, SEED[id]||{});

// ===== 유틸 =====
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const clock = t => t ? new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
const mem = {};
function dget(k,d){ try{ const v=localStorage.getItem('sl2-'+k); return v==null?d:JSON.parse(v); }catch(e){ return mem[k]==null?d:mem[k]; } }
function dset(k,v){ mem[k]=v; try{ v==null?localStorage.removeItem('sl2-'+k):localStorage.setItem('sl2-'+k,JSON.stringify(v)); }catch(e){} }
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

// ===== 저장소: 아티팩트 공유 DB (없으면 이 기기 안에서만) =====
const S = {bands:{},reports:{},ready:false};
let DB=null, bc=null;
const LKEY='sl2-local';
const getBand = id => S.bands[id] || seedBand(id);
function localLoad(){ let st=null; try{ st=JSON.parse(localStorage.getItem(LKEY)); }catch(e){} return st||mem.local||{bands:{},reports:{}}; }
function localSave(st){ mem.local=st; try{ localStorage.setItem(LKEY,JSON.stringify(st)); }catch(e){} try{ bc&&bc.postMessage(1); }catch(e){} }
function localApply(){ const st=localLoad(); S.bands=st.bands; S.reports=st.reports; S.ready=true; onData(); }
async function init(){
  let db=null;
  try{ if(FIREBASE_CONFIG&&window.firebase){ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); } }catch(e){ toast('Firebase 설정 오류'); }
  if(db){
    DB=db; let gotB=false, gotR=false;
    const ok=()=>{ if(gotB&&gotR) S.ready=true; onData(); };
    const bad=()=>toast('연결 오류 — 새로고침해 주세요');
    DB.collection('bands').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.bands=o; gotB=true; ok(); },bad);
    DB.collection('reports').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=Object.assign({},d.data(),{id:d.id})); S.reports=o; gotR=true; ok(); },bad);
  }else{
    try{ bc=new BroadcastChannel('sl2'); bc.onmessage=localApply; }catch(e){}
    addEventListener('storage',e=>{ if(e.key===LKEY) localApply(); });
    localApply();
  }
}
async function write(fn){ for(let i=0;i<3;i++){ try{ return await fn(); }catch(e){ if(i===2){ toast('전송 실패 — 다시 눌러 주세요'); throw e; } await new Promise(r=>setTimeout(r,400)); } } }
async function saveBand(id,b){
  const full=Object.assign(getBand(id),b);
  if(!DB){ const st=localLoad(); st.bands[id]=full; localSave(st); return localApply(); }
  S.bands[id]=full; onData(); await write(()=>DB.collection('bands').doc(id).set(full));
}
async function addReport(r){
  if(!DB){ const st=localLoad(); st.reports[r.id]=r; localSave(st); return localApply(); }
  S.reports[r.id]=r; onData(); const c=Object.assign({},r); delete c.id;
  await write(()=>DB.collection('reports').doc(r.id).set(c));
}
async function patch(id,p){
  if(!DB){ const st=localLoad(); if(st.reports[id]) Object.assign(st.reports[id],p); localSave(st); return localApply(); }
  if(S.reports[id]) Object.assign(S.reports[id],p); onData(); await write(()=>DB.collection('reports').doc(id).update(p));
}
async function resetAll(){
  if(!DB){ localSave({bands:{},reports:{}}); return localApply(); }
  for(const id of Object.keys(S.reports)) await write(()=>DB.collection('reports').doc(id).delete());
  for(const id of BANDS) await write(()=>DB.collection('bands').doc(id).set(seedBand(id)));
}

// ===== 신고 도우미 =====
const isOpen = r => r.status!=='closed' && r.status!=='cancelled';
const openReports = () => Object.values(S.reports).filter(isOpen).sort((a,b)=>b.createdAt-a.createdAt);
const allReports = () => Object.values(S.reports).sort((a,b)=>(isOpen(b)-isOpen(a))||(b.createdAt-a.createdAt));
function seatLabel(b){ if(!b.zoneId) return ''; const z=ZONES[b.zoneId]; return z.stand?z.name:(b.seatDetail?z.floor+' '+b.seatDetail:z.name); }
function badge(r){
  if(r.status==='cancelled') return '<span class="badge b-gray">취소됨</span>';
  if(r.status==='closed') return '<span class="badge b-ok">종료</span>';
  return r.consciousness==='없음' ? '<span class="badge b-urgent">긴급</span>' : '<span class="badge b-check">확인 필요</span>';
}

// ===== 화면 상태 =====
let V = {s:'HOME',p:{}};
const DARK = new Set(['S1','S2','S3','M1']);
const LIVE = new Set(['A3','A4','A5','S1','S2','S3','M1']);
function go(s,p){ V={s,p:p||{}}; autoSms(); render(); scrollTo(0,0); }
// 의식 없음 신고: 그 신고의 출동 화면에 있으면 119 문자 창을 한 번 자동으로 연다
function autoSms(){
  if(V.s!=='S2') return false;
  const r=S.reports[V.p.id], opened=dget('smsOpened',[]);
  if(!r||!isOpen(r)||r.consciousness!=='없음'||opened.includes(r.id)) return false;
  opened.push(r.id); dset('smsOpened',opened); V.p.sms=true; return true;
}
const brand = (t,r) => `<div class="brand"><span><i>★</i> STARLIGHT LIVE ${esc(t)}</span>${r||''}</div>`;
const foot = '<p class="foot">시연용 화면입니다. 실제 신고·전화·문자는 되지 않습니다.</p>';

const SCREENS = {
HOME(){
  const cards=[['band-0001','팔찌 #0001','관객 폰 · 처음엔 등록, 다시 찍으면 신고'],['band-0002','팔찌 #0002','예시 등록 팔찌 · 스태프 폰으로 찍으면 환자 확인'],
    ['qr-STAND-C','스탠딩 C구역 펜스','관객 폰 · 구역 자동 신고'],['staff','STAFF 전용','스태프 폰으로 찍기']];
  return `<div class="wrap wide">${brand('응급 팔찌 시연')}
  <h1>폰 카메라로 QR을 찍으세요</h1>
  <p class="sub">이 화면을 노트북에 띄워 두고, 관객 폰·스태프 폰으로 각자 QR을 찍으면 그 화면이 열립니다. 로그인은 필요 없어요.</p>
  <div class="qrs">${cards.map(([h,t,s])=>`<div class="card line" style="align-items:center;text-align:center"><div class="qr" data-qr="${APP}#${h}"></div><b>${t}</b><span class="small">${s}</span></div>`).join('')}</div>
  <button class="btn red" data-act="toMonitor" style="max-width:420px;align-self:center">이 노트북을 응급처치실 모니터로 쓰기</button>${foot}</div>`;
},

// ---------- 관객 ----------
A1(p){ return `<div class="wrap">${brand('응급 팔찌 등록')}
  <h1>내 팔찌 등록하기</h1>
  <p class="sub">정보를 넣어 두면 응급 시 더 빨리 도울 수 있어요</p>
  <div class="card"><b>STARLIGHT LIVE BAND #${esc(p.band)}</b><p class="small">입력한 정보는 응급 시 스태프·의료팀만 볼 수 있어요.</p></div>
  <button class="btn red" data-act="startReg">등록 시작</button>
  <button class="btn out" data-act="toReport">응급 신고하기<small>입력하지 않아도 신고는 똑같이 돼요</small></button>${foot}</div>`; },

A2(p){
  if(p.done){ const b=getBand(p.band); return `<div class="wrap">${brand('응급 팔찌 등록')}
    <h1>등록됐어요!</h1><p class="sub">응급 시 스태프·의료팀만 볼 수 있어요</p>
    <div class="card"><dl class="kv"><dt>팔찌</dt><dd>STARLIGHT LIVE BAND #${esc(p.band)}</dd><dt>좌석</dt><dd>${esc(seatLabel(b)||'미입력')}</dd></dl></div>

function render(){
  document.body.classList.toggle('dark',DARK.has(V.s));
  $('app').innerHTML=SCREENS[V.s](V.p);
  $('modal').innerHTML=V.p.sms?smsModal(S.reports[V.p.id]):'';
  document.querySelectorAll('[data-qr]').forEach(el=>{ try{ new QRCode(el,{text:el.dataset.qr,width:320,height:320,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent=el.dataset.qr; el.className='small'; } });
  tick();
}
function smsModal(r){
  if(!r) return '';
  const b=r.bandId?getBand(r.bandId):null, reg=b&&b.registered;
  const body=`[응급] STARLIGHT 공연장 ${r.locationLabel}\n주소: OO시 OO로 00 / 가까운 건물: OO역\n의식 ${r.consciousness||'모름'} · 외상 ${r.trauma||'모름'}\n기왕력: ${reg?(b.conditions.join(', ')||'없음'):'등록 없음'}\n연락처: ${reg&&b.phone?b.phone:'등록 없음'}`;
  return `<div class="modal"><div class="in"><div class="box">
    <div class="row" style="justify-content:space-between"><b style="font-size:19px">119 문자 신고</b><span class="small">확인 후 보내기</span></div>
    <div class="warn" style="font-size:15px">통화가 가능하면 119 전화가 우선입니다</div>
    <pre class="msg">${esc(body)}</pre>
    ${r.sms119At?'<div class="btn green">시연용: 실제로 보내지 않았습니다</div>':'<button class="btn red" data-act="sendSms">보내기</button>'}
    <button class="btn out" data-act="closeSms">닫기</button></div></div></div>`;
}
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-since]').forEach(el=>{ const stop=+el.dataset.stop||0; el.textContent=fmt((stop||now)-(+el.dataset.since)); });
  document.querySelectorAll('[data-until]').forEach(el=>{ const left=+el.dataset.until-now; if(left<=0) el.remove(); else el.firstChild.textContent=`실수로 눌렀어요 (${Math.ceil(left/1000)}초 안에 취소)`; });
}
let sec=0; setInterval(()=>{ tick(); if(V.s==='M1'&&++sec%3===0) render(); },1000);

// ===== 스태프 알림·자동 동작 =====
let audio=null, known=null, pendingBand=null;
document.addEventListener('click',()=>{ try{ if(!audio){ const C=window.AudioContext||window.webkitAudioContext; if(C) audio=new C(); } audio&&audio.resume&&audio.resume(); }catch(e){} },{capture:true});
function ring(){
  try{ if(audio){ const t=audio.currentTime; [0,.25].forEach(d=>{ const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.001,t+d); g.gain.exponentialRampToValueAtTime(.4,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.18); o.start(t+d); o.stop(t+d+.2); }); } }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([300,120,300]); }catch(e){}
  document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
}
const isStaff = () => dget('role',null)==='staff';
function onData(){
  if(!S.ready) return;
  if(pendingBand){ const id=pendingBand; pendingBand=null; return staffVerify(id); }
  if(isStaff()){
    const ids=Object.keys(S.reports);
    if(known===null) known=new Set(ids);
    else{ const fresh=ids.filter(id=>!known.has(id)); fresh.forEach(id=>known.add(id)); if(fresh.some(id=>isOpen(S.reports[id]))) ring(); }
    // 의식 없음 신고: 그 신고의 출동 화면에 있으면 119 문자 창을 한 번 자동으로 연다
    if(autoSms()) ring();
    if(V.s==='S1'){ const opened=dget('urgentSeen',[]); const u=openReports().find(r=>r.consciousness==='없음'&&!opened.includes(r.id)); if(u){ opened.push(u.id); dset('urgentSeen',opened); ring(); } }
  }
  if(LIVE.has(V.s)) render();
}
async function staffVerify(bandId){
  let r=S.reports[dget('active',null)];
  if(!r||!isOpen(r)) r=openReports()[0];
  // 확인할 신고가 없으면 확인이 아니라 관객으로 찍은 것: 관객 화면을 연다
  if(!r) return getBand(bandId).registered ? openReportFor({band:bandId}) : go('A1',{band:bandId});
  const wasPlace=!r.bandId, result=r.bandId===bandId?'일치':'변경';
  const p={status:'verified',verifiedAt:r.verifiedAt||Date.now(),verifyResult:result,acceptedAt:r.acceptedAt||Date.now()};
  if(result==='변경'){ p.originalBandId=r.bandId||null; p.bandId=bandId; }
  dset('active',r.id);
  await patch(r.id,p);
  go('S3',{id:r.id,result,wasPlace});
}

// ===== 버튼 =====
const ACT = {
  startReg(){ const b=getBand(V.p.band); go('A2',{band:V.p.band,f:{name:b.name||'',phone:b.phone||'',zoneId:b.zoneId,seatDetail:b.seatDetail||'',conditions:(b.conditions||[]).slice(),consent:!!b.consent}}); },
  toReport(){ openReportFor({band:V.p.band}); },
  fzone(z){ V.p.f.zoneId=z; render(); },
  fcond(c){ const a=V.p.f.conditions, i=a.indexOf(c); i<0?a.push(c):a.splice(i,1); render(); },
  async save(){ const F=V.p.f;
    if(F.conditions.length&&!F.consent) return toast('기왕력을 저장하려면 동의가 필요해요');
    await saveBand(V.p.band,{registered:true,name:F.name.trim(),phone:F.phone.trim(),zoneId:F.zoneId||null,seatDetail:F.zoneId&&!ZONES[F.zoneId].stand?F.seatDetail.trim():'',conditions:F.consent?F.conditions:[],consent:F.consent,registeredAt:Date.now()});
    go('A2',{band:V.p.band,done:true}); },
  pzone(z){ V.p.zone=z; V.p.pos=null; render(); },
  ppos(x){ V.p.pos=V.p.pos===x?null:x; render(); },
  async send(){ const p=V.p; if(p.sending) return;
    const b=p.band?getBand(p.band):null;
    const zoneId=p.place||(b&&b.registered&&b.zoneId)||p.zone; if(!zoneId) return;
    const base=p.place?ZONES[zoneId].name:(b&&b.registered&&b.zoneId?seatLabel(b):ZONES[zoneId].name);
    const r={id:'r'+Date.now()+Math.random().toString(36).slice(2,6),createdAt:Date.now(),source:p.place?'place':'band',bandId:p.place?null:p.band,
      originalBandId:null,placeId:p.place||null,zoneId,locationLabel:base+(p.pos?' ('+p.pos+')':''),consciousness:null,trauma:null,status:'received',
      acceptedAt:null,verifiedAt:null,closedAt:null,cancelledAt:null,verifyResult:null,sms119At:null,outcome:null};
    p.sending=true; render();
    try{ await addReport(r); go('A4',{id:r.id}); }catch(e){ p.sending=false; render(); } },
  async cancel(){ const r=S.reports[V.p.id]; if(!r||r.status!=='received'||Date.now()-r.createdAt>10000) return; await patch(r.id,{status:'cancelled',cancelledAt:Date.now()}); },
  async pick(a){ const [f,v]=a.split('|'); const r=S.reports[V.p.id]; if(!r) return; const nv=r[f]===v?null:v;
    await patch(r.id,{[f]:nv}); if(f==='consciousness'&&nv==='없음') go('A5',{id:r.id}); },
  backA4(){ go('A4',{id:V.p.id}); },
  async dispatch(id){ const r=S.reports[id]; dset('active',id); if(r.status==='received') await patch(id,{status:'dispatched',acceptedAt:Date.now()}); go('S2',{id}); },
  card(){ V.p.card=!V.p.card; render(); },
  sms(){ V.p.sms=true; render(); },
  closeSms(){ V.p.sms=false; render(); },
  async sendSms(){ await patch(V.p.id,{sms119At:Date.now()}); toast('시연용: 실제로 보내지 않았습니다'); },
  async close(){ const r=S.reports[V.p.id]; await patch(r.id,{status:'closed',closedAt:Date.now(),outcome:r.sms119At?'119 인계':'응급처치실 인계'}); dset('active',null); go('S1'); },
  manualVerify(){ const v=($('bandno').value||'').trim().padStart(4,'0'); if(!BANDS.includes(v)) return toast('팔찌 번호를 찾지 못했어요'); staffVerify(v); },
  toMonitor(){ location.hash='monitor'; route(); },
  toS1(){ go('S1'); },
  toS2(id){ go('S2',{id}); },
  async reset(){ if(!V.p.confirm){ V.p.confirm=true; return render(); }
    toast('초기화 중…'); await resetAll(); ['role','active','smsOpened','urgentSeen'].forEach(k=>dset(k,null)); known=null; V.p.confirm=false; render(); toast('처음 상태로 되돌렸어요'); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=ACT[el.dataset.act]; if(f) f(el.dataset.arg,el); });
document.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.f; if(!k||!V.p.f) return; V.p.f[k]=e.target.type==='checkbox'?e.target.checked:e.target.value; });

// ===== 진입 (QR 해시) =====
function openReportFor(p){
  const dup=openReports().find(r=>p.place?r.placeId===p.place:r.bandId===p.band);
  if(dup) return go('A4',{id:dup.id});
  go('A3',p);
}
function route(){
  const h=decodeURIComponent((location.hash||'').slice(1));
  if(h==='staff'){ dset('role','staff'); known=null; return go('S1'); }
  if(h==='monitor'){ dset('role','monitor'); return go('M1'); }
  if(h==='reset') return go('RESET');
  if(h.startsWith('band-')&&BANDS.includes(h.slice(5))){
    const id=h.slice(5);
    if(isStaff()){ if(S.ready) return staffVerify(id); pendingBand=id; return go('S1'); }
    if(!S.ready){ V={s:'WAIT',p:{band:id}}; $('app').innerHTML='<div class="wrap"><p>불러오는 중…</p></div>'; return; }
    return getBand(id).registered ? openReportFor({band:id}) : go('A1',{band:id});
  }
  if(h.startsWith('qr-')&&ZONES[h.slice(3)]) return S.ready?openReportFor({place:h.slice(3)}):(V={s:'WAIT',p:{place:h.slice(3)}});
  // 로그인하느라 주소 뒤가 지워졌을 때: 이 기기의 역할로
  if(isStaff()) return go('S1');
  if(dget('role',null)==='monitor') return go('M1');
  go('HOME');
}
// 데이터가 준비되기 전에 팔찌·펜스 QR로 들어온 경우
const _onData=onData;
onData=function(){ if(V.s==='WAIT'&&S.ready){ const p=V.p; if(p.place) return openReportFor({place:p.place}); return getBand(p.band).registered?openReportFor({band:p.band}):go('A1',{band:p.band}); } return _onData(); };
addEventListener('hashchange',route);
route();
init();
</script>
